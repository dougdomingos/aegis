      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.PropagationOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Get machine propagation status
      tags:
      - Machines
  /machines/import:
    post:
      operationId: importMachines
      requestBody:
        content:
          text/csv:
            schema:
              type: string
          text/plain:
            schema:
              title: body
              type: string
        description: CSV
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.MachineImportOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Import machines
      tags:
      - Machines
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: aegis_propagation_duration_seconds{group} histogram; aegis_propagations_total{group,status}
            counter
      summary: Prometheus metrics
      tags:
      - Metrics
  /policies:
    get:
