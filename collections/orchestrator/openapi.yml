          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Link policy to group
      tags:
      - Groups
  /groups/rename:
    patch:
      operationId: renameGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schemas.ChangeGroupNameSchema'
