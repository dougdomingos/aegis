          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Unlink policy from group
      tags:
      - Groups
    post:
      operationId: linkPolicyToGroup
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
