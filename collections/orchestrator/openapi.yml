components:
  schemas:
    domain.PolicyType:
      enum:
      - WHITELIST
      - BLACKLIST
      type: string
      x-enum-varnames:
      - WhitelistPolicyType
      - BlacklistPolicyType
    domain.RuleType:
      enum:
      - DOMAIN
      - IP
      type: string
      x-enum-varnames:
      - DomainRuleType
      - IPRuleType
    schemas.ChangeGroupNameSchema:
      properties:
        newName:
          type: string
        targetGroupName:
          type: string
      type: object
    schemas.CreateGroupSchema:
      properties:
        name:
          type: string
      type: object
    schemas.CreatePolicySchema:
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/domain.PolicyType'
      type: object
    schemas.CreateRuleSchema:
      properties:
        port:
          type: integer
        protocol:
          type: string
        rule_type:
          $ref: '#/components/schemas/domain.RuleType'
        value:
          type: string
      type: object
    schemas.GroupOutputSchema:
      properties:
        createdAt:
          type: string
        id:
          type: integer
        machineIDs:
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          type: string
        policyID:
          description: |-
            PolicyID is the identifier of the linked policy, or nil when no policy is
            linked.
          type: integer
        policyName:
          description: PolicyName is the name of the linked policy; empty when none
            is linked.
          type: string
      type: object
    schemas.LinkMachineToGroupSchema:
      properties:
        machine_id:
          type: integer
      type: object
    schemas.LinkPolicyToGroupSchema:
      properties:
        policy_name:
          type: string
      type: object
    schemas.MachineImportOutputSchema:
      properties:
        groups_created:
          type: integer
        machines_created:
          type: integer
        machines_linked:
          type: integer
        machines_updated:
          type: integer
      type: object
    schemas.MachineOutputSchema:
      properties:
        createdAt:
          type: string
        groupID:
          type: integer
        groupName:
          type: string
        id:
          type: integer
        ip:
          type: string
        lastSeenAt:
          type: string
        mac:
          type: string
        name:
          type: string
        propagation:
          $ref: '#/components/schemas/schemas.PropagationOutputSchema'
        status:
          type: string
      type: object
    schemas.PolicyOutputSchema:
      properties:
        created_at:
          type: string
        id:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/domain.PolicyType'
        updated_at:
          type: string
        version:
          type: integer
      type: object
    schemas.PropagationOutputSchema:
      properties:
        acked_at:
          type: string
        duration_ms:
          type: integer
        kind:
          type: string
        nack_reason:
          type: string
        policy_id:
          type: integer
        policy_name:
          type: string
        policy_type:
          type: string
        policy_version:
          type: integer
        sent_at:
          type: string
        sequence:
          type: integer
        status:
          type: string
      type: object
    schemas.RuleOutputSchema:
      properties:
        created_at:
          type: string
        id:
          type: integer
        policy_id:
          type: integer
        port:
          type: integer
        protocol:
          type: string
        rule_type:
          $ref: '#/components/schemas/domain.RuleType'
        value:
          type: string
      type: object
    schemas.UpdatePolicySchema:
      properties:
        id:
          type: integer
        name:
          type: string
      type: object
    schemas.UpdateRuleSchema:
      properties:
        id:
          type: integer
        port:
          type: integer
        protocol:
          type: string
        value:
          type: string
      type: object
    utils.ErrorResponse:
      properties:
        error_code:
          type: integer
        message:
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  title: Aegis - Orchestrator Admin API
  version: v0.1.0
openapi: 3.1.0
paths:
  /groups:
    get:
      operationId: listGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/schemas.GroupOutputSchema'
                type: array
          description: OK
      summary: List groups
      tags:
      - Groups
    post:
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schemas.CreateGroupSchema'
              description: Group
              summary: body
        description: Group
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.GroupOutputSchema'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Create group
      tags:
      - Groups
  /groups/{name}:
    delete:
      operationId: deleteGroup
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Delete group
      tags:
      - Groups
    get:
      operationId: getGroupByName
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.GroupOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Get group by name
      tags:
      - Groups
  /groups/{name}/machines:
    get:
      operationId: listGroupMachines
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/schemas.MachineOutputSchema'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: List machines of a group
      tags:
      - Groups
    post:
      operationId: linkMachineToGroup
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schemas.LinkMachineToGroupSchema'
              description: Machine
              summary: body
        description: Machine
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.MachineOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Link machine to group
      tags:
      - Groups
  /groups/{name}/machines/{machineID}:
    delete:
      operationId: unlinkMachineFromGroup
      parameters:
      - description: Group name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Machine ID
        in: path
        name: machineID
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.MachineOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Unlink machine from group
      tags:
      - Groups
  /groups/{name}/policy:
