          description: Bad Request
      summary: Create policy
      tags:
      - Policies
  /policies/{policyID}:
    delete:
      operationId: deletePolicy
      parameters:
      - description: Policy ID
        in: path
        name: policyID
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Delete policy
      tags:
      - Policies
    get:
      operationId: getPolicyById
      parameters:
      - description: Policy ID
        in: path
        name: policyID
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas.PolicyOutputSchema'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Bad Request
      summary: Get policy by ID
      tags:
      - Policies
    patch:
      operationId: updatePolicy
      parameters:
      - description: Policy ID
        in: path
        name: policyID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schemas.UpdatePolicySchema'
              description: Policy
              summary: body
        description: Policy
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
