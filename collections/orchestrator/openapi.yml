          description: Bad Request
      summary: Rename group
      tags:
      - Groups
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Liveness probe
      tags:
