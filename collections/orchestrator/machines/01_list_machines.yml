info:
  name: 01 - List Machines
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/machines"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
