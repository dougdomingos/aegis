info:
  name: 04 - Rename Group
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/groups/rename"
  body:
    type: json
    data: |-
      {
        "TargetGroupName": "lab1",
        "NewName": "lab-one"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
