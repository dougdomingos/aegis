info:
  name: 03 - Get Group Not Found
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/groups/unknown"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
