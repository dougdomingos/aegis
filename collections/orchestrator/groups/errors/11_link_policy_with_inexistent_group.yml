info:
  name: 11 - Link Policy with Inexistent Group
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/groups/unknown/policy"
  body:
    type: json
    data: |-
      {
        "policy_name": "Test Policy"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
