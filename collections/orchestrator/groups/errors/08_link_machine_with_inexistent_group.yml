info:
  name: 08 - Link Machine with Inexistent Group
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/groups/unknown/machines"
  body:
    type: json
    data: |-
      {
        "machine_id": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true