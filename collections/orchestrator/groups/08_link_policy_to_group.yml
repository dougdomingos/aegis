info:
  name: 08 - Link Policy to Group
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/groups/lab-one/policy"
  body:
    type: json
    data: |-
      {
        "policy_name": "Test Policy"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
