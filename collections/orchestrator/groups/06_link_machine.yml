info:
  name: 06 - Link Machine to Group
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/groups/lab-one/machines"
  body:
    type: json
    data: |-
      {
        "machine_id": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true