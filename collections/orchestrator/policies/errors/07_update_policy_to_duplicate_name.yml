info:
  name: 07 - Update Policy To Duplicate Name
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/policies/1"
  body:
    type: json
    data: |-
      {
        "name": "Test Policy"
      }

runtime:
