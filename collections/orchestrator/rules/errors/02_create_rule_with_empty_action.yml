info:
  name: 02 - Create Rule with Empty Action
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/rules"
  body:
    type: json
    data: |-
      {
        "rule_type": "DOMAIN",
        "action": "",
        "value": "test.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
