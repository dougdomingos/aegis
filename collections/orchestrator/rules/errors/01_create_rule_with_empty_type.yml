info:
  name: 01 - Create Rule with Empty Type
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/policies/{{policyID}}/rules"
  body:
    type: json
    data: |-
      {
        "rule_type": "",
        "value": "test.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
