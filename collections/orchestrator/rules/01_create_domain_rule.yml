info:
  name: 01 - Create Domain Rule
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rules"
  body:
    type: json
    data: |-
      {
        "rule_type": "DOMAIN",
        "action": "ALLOW",
        "value": "test.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
