# Prometheus scrape configuration for the Aegis Orchestrator.
#
# Propagations happen in bursts (typically once per exam), so the series stay
# flat between them. Query with a long range (for example increase(...[1d]))
# rather than a short rate() window.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: aegis-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8080"]
