pre-commit:
  parallel: true
  commands:
    # Organize imports and format code in a single step
    goimports:
      glob: "*.go"
      run: goimports -w {staged_files}
      stage_fixed: true

    # Run linter over the entire code, only report errors introduced by new commit
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD~1 ./...

pre-push:
  parallel: false
  commands:
    # Quick sanity check before pushing to remote
    go-vet:
      glob: "*.go"
      run: go vet ./...

    # Run short unit tests locally before pushing
    go-test:
      glob: "*.go"
      run: go test -short ./...